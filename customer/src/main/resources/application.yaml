spring:
  application:
    name: CUSTOMERS  # or customers, and ensure Gateway route uses correct case-insensitive lookup customers
  threads:
    virtual:
      enabled: true
  main:
    allow-circular-references: true
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
              lower-case-service-id: true
  datasource:
    url: jdbc:postgresql://localhost:5432/db_cptc_customers?schema=public
    username: dev_cptc_user
    password: localpass
    hikari:
      max-lifetime: 600000
  flyway:
    baseline-on-migrate: true
    user: dev_cptc_user
    password: localpass
    url: jdbc:postgresql://localhost:5432/db_cptc_customers?schema=public
    schemas: public
  jpa:
    database: POSTGRESQL
    hibernate:
      ddl-auto: validate # schema management authority
    properties:
      hibernate:
        format_sql: true
    show-sql: true
  sql:
    init:
      platform: postgres
      mode: always
  Jackson:
    time-zone: Africa/Johannesburg
    date-format: dd-MM-yyyy HH:mm:ss

# spring cloud configuration
eureka:
  instance:
    preferIpAddress: true
    instance-id: ${spring.application.name}:${instanceId:${random.value}} # to randomly generate port number for multiple instances
  client:
    fetchRegistry: true
    registerWithEureka: true
    serviceUrl:
      defaultZone: http://localhost:8070/eureka/

   #-- enable the gzip configs
server:
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,application/json,application/xml,text/css,text/javascript,application/javascript
    min-response-size: 2KB
  port: 0
  shutdown: graceful

management:
  endpoints:
    enabled-by-default: true
    web:
      base-path: /actuator
      exposure:
        include: "*"
  endpoint:
    health:
      enabled: true
      show-details: always
      probes:
        enabled: true

#-- open-api and swagger configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger.html
